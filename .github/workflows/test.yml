name: ResumeAI Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          cd backend-fastapi
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd backend-fastapi
          pytest



  frontend-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm install

      - name: Run Frontend Tests
        run: |
          cd Frontend
          npm test || true